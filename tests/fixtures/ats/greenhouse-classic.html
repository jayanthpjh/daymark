<!doctype html><html><body>
<form id="application_form">
  <div class="field"><label for="first_name">First Name<span class="asterisk"> *</span></label><input id="first_name" name="first_name" type="text"></div>
  <div class="field"><label for="last_name">Last Name <span class="required-mark">(required)</span></label><input id="last_name" name="last_name" type="text"></div>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div class="field"><div class="question-label">LinkedIn Profile</div><input name="question_1001" type="text"></div>
  <div class="field"><div class="label">Are you legally authorized to work in the United States? *</div>
    <div><label><input type="radio" name="question_1002" value="1"> Yes</label><label><input type="radio" name="question_1002" value="0"> No</label></div></div>
  <div class="field"><div class="label">Cover letter</div><div id="cover" contenteditable="true" role="textbox"></div></div>
  <div class="field"><input type="text" required></div>
</form>
<script>
  const phone=document.getElementById('phone');
  phone.addEventListener('input',()=>{const d=phone.value.replace(/\D/g,'').slice(-10);phone.value=d.length===10?'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6):d;});
</script>
</body></html>
