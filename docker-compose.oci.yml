# Daymark on one OCI Ampere A1 VM (arm64). Every published port is bound to the Tailscale address only; nothing is public.
# Start: docker compose --env-file .env.oci -f docker-compose.oci.yml up -d --build
name: daymark

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  postgres:
    container_name: daymark-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daymark
      POSTGRES_USER: daymark
      POSTGRES_PASSWORD: "${DAYMARK_POSTGRES_PASSWORD:?Run node scripts/setup-oci.mjs first}"
    volumes: ["/srv/daymark/postgres:/var/lib/postgresql/data"]
    mem_limit: 768m
    shm_size: 128m
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U daymark -d daymark"], interval: 5s, timeout: 3s, retries: 12 }
    logging: *logging

  redis:
    container_name: daymark-redis
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes: ["/srv/daymark/redis:/data"]
    mem_limit: 128m
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 12 }
    logging: *logging

  searxng:
    container_name: daymark-search
    image: searxng/searxng:latest
    restart: unless-stopped
    environment: { SEARXNG_SECRET: "${SEARXNG_SECRET:?Run node scripts/setup-oci.mjs first}" }
    volumes: ["/srv/daymark/searxng:/etc/searxng"]
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  daymark-api:
    container_name: daymark-api
    build: { context: ., dockerfile: docker/Dockerfile.api }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    env_file: [.env.oci]
    environment:
      DAYMARK_ROLE: api
      DAYMARK_HOST: 0.0.0.0
      DAYMARK_DATA_DIR: /srv/daymark/data
      DAYMARK_DATABASE_URL: "postgresql://daymark:${DAYMARK_POSTGRES_PASSWORD}@postgres:5432/daymark"
      DAYMARK_REDIS_URL: redis://redis:6379/0
      PROTON_BRIDGE_HOST: "${MAC_BRIDGE_TAILSCALE_HOST:?Set the Mac Tailscale host after configuring restricted Serve}"
      PROTON_BRIDGE_PORT: "11143"
      PROTON_BRIDGE_SMTP_PORT: "11025"
      DAYMARK_BRIDGE_HOSTS: "${MAC_BRIDGE_TAILSCALE_HOST}"
      NVIDIA_MODEL: "${NVIDIA_MODEL:-nvidia/nemotron-3-super-120b-a12b}"
      NVIDIA_RPM: "${NVIDIA_RPM:-10}"
      LLM_HOSTED_ENABLED: "${LLM_HOSTED_ENABLED:-false}"
      SEARXNG_URL: http://searxng:8080
    volumes: ["/srv/daymark/data:/srv/daymark/data", "/srv/daymark/secrets:/run/secrets:ro"]
    ports: ["${TAILSCALE_IP:?Set TAILSCALE_IP in .env.oci}:4173:4173"]
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  application-worker:
    container_name: daymark-worker
    platform: linux/arm64
    build: { context: ., dockerfile: docker/Dockerfile.worker }
    init: true
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    user: "${DAYMARK_UID:-1000}:${DAYMARK_GID:-1000}"
    env_file: [.env.oci]
    environment:
      DAYMARK_ROLE: worker
      DAYMARK_DATA_DIR: /srv/daymark/data
      DAYMARK_BROWSER_PROFILE_DIR: /srv/daymark/data/docker-browser-profile
      DAYMARK_DATABASE_URL: "postgresql://daymark:${DAYMARK_POSTGRES_PASSWORD}@postgres:5432/daymark"
      DAYMARK_REDIS_URL: redis://redis:6379/0
      DAYMARK_WORKER_PORT: "4174"
      DAYMARK_BROWSER_CONCURRENCY: "1"
      NVIDIA_MODEL: "${NVIDIA_MODEL:-nvidia/nemotron-3-super-120b-a12b}"
      NVIDIA_RPM: "${NVIDIA_RPM:-10}"
      LLM_HOSTED_ENABLED: "${LLM_HOSTED_ENABLED:-false}"
      DAYMARK_ATS_CREDENTIALS_PATH: /run/secrets/daymark-ats-credentials
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /tmp
      DISPLAY: ":99"
    volumes: ["/srv/daymark/data:/srv/daymark/data", "/srv/daymark/secrets:/run/secrets:ro"]
    ports: ["${TAILSCALE_IP}:6080:6080"]
    shm_size: 1gb
    mem_limit: 3g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  default:
    name: daymark-net
